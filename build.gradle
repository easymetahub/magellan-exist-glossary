import org.apache.tools.ant.filters.BaseFilterReader
import org.apache.tools.ant.taskdefs.condition.Os

buildscript {
    repositories {
        mavenCentral()
        maven { url 'https://raw.githubusercontent.com/xqdoc/xqdoc/mvn-repo' }
    }

    dependencies {
        classpath "org.xqdoc:xqdoc:1.9.9.2"
    }
}

// Note: no `java` plugin needed — the XAR is a Zip of XQuery + resources.
// JDK 17 is enforced via .tool-versions / CI.

repositories {
    mavenCentral()
    maven { url 'https://raw.githubusercontent.com/xqdoc/xqdoc/mvn-repo' }
}

class XQDocFilter extends BaseFilterReader {
    XQDocFilter(Reader input) {
        super(new StringReader(new org.xqdoc.ExistDBProcessor().process(input.text)))
    }
}

// Keep package version in exactly one place:
// src/main/resources/expath-pkg.xml @version drives the XAR file name.
def expathPkg = new groovy.xml.XmlSlurper(false, false).parse(file('src/main/resources/expath-pkg.xml'))
def xarVersion = expathPkg.@version.text()
if (!xarVersion) {
    throw new GradleException('Missing @version in src/main/resources/expath-pkg.xml')
}

/**
 * Front-end build:
 *   The Lit 3 frontends (public UI + admin UI) in src/main/lit are always
 *   built by Vite and bundled into the XAR. The legacy Polymer 3 sources
 *   were removed in Phase 2d.
 */

// -------- Lit 3 (Vite) frontends -----------------------------------------

task npmInstallLitBase(type: Exec) {
    String npm = Os.isFamily(Os.FAMILY_WINDOWS) ? 'npm.cmd' : 'npm'
    workingDir 'src/main/lit/base'
    commandLine npm, 'ci'
}

task viteBuildBase(type: Exec) {
    String npm = Os.isFamily(Os.FAMILY_WINDOWS) ? 'npm.cmd' : 'npm'
    workingDir 'src/main/lit/base'
    commandLine npm, 'run', 'build'
}

task copyLitBase(type: Copy) {
    from 'src/main/lit/base/dist'
    into 'build/default'
}

task npmInstallLitAdmin(type: Exec) {
    String npm = Os.isFamily(Os.FAMILY_WINDOWS) ? 'npm.cmd' : 'npm'
    workingDir 'src/main/lit/admin'
    commandLine npm, 'ci'
}

task viteBuildAdmin(type: Exec) {
    String npm = Os.isFamily(Os.FAMILY_WINDOWS) ? 'npm.cmd' : 'npm'
    workingDir 'src/main/lit/admin'
    commandLine npm, 'run', 'build'
}

task copyLitAdmin(type: Copy) {
    from 'src/main/lit/admin/dist'
    into 'build/default/admin'
}

task cleanDefaultOutput(type: Delete) {
    delete 'build/default'
}

task clean(type: Delete) {
    delete 'build'
    delete 'src/main/js/skos-app/build'
    delete 'src/main/js/skos-app/node_modules'
    delete 'src/main/lit/admin/dist'
    delete 'src/main/lit/admin/node_modules'
    delete 'src/main/lit/base/dist'
    delete 'src/main/lit/base/node_modules'
}

// -------- XQuery + resources --------------------------------------------

task copyModules(type: Copy) {
    into 'build/default'
    from 'src/main/xquery'
}

task copyResources(type: Copy) {
    into 'build/default'
    from 'src/main/resources'
}

// -------- xqDoc generation ----------------------------------------------

task generateXQDocs(type: Copy) {
    into 'xqDoc'
    from 'src/main/xquery'
    include '**/*.xq*'
    rename { it - '.xq*' + '.xml' }
    includeEmptyDirs = false
    eachFile { println it }
    filter XQDocFilter
}

def xqDocTree = fileTree(dir: 'xqDoc', excludes: ['openapi.json'])
task fsTeardownXQDocs(type: Delete) {
    delete xqDocTree
}

generateXQDocs.mustRunAfter(fsTeardownXQDocs)

// -------- XAR packaging --------------------------------------------------

task buildXAR(type: Zip) {
    from 'build/default/'
    include '*'
    include '*/**'
    archiveFileName = "magellan-glossary-${xarVersion}.xar"
    destinationDirectory = file('build/')
}

// Task dependencies
copyModules.dependsOn cleanDefaultOutput
copyResources.dependsOn cleanDefaultOutput
copyLitBase.dependsOn cleanDefaultOutput
copyLitAdmin.dependsOn cleanDefaultOutput

buildXAR.dependsOn copyModules
buildXAR.dependsOn copyResources

buildXAR.dependsOn copyLitBase
copyLitBase.dependsOn viteBuildBase
viteBuildBase.dependsOn npmInstallLitBase

buildXAR.dependsOn copyLitAdmin
copyLitAdmin.dependsOn viteBuildAdmin
viteBuildAdmin.dependsOn npmInstallLitAdmin
